<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写稿 · 糖渍旧蜜</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
<style>
:root{--paper:#f6f1e7;--paper2:#fffdf8;--ink:#2a2420;--soft:#5d534b;--dim:#8b7d70;--line:rgba(70,52,34,.16);--amber:#b0793a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Noto Serif SC",Georgia,serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.08em;color:var(--dim)}
.top b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.hide{display:none!important}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:22px}
.login{max-width:380px;margin:14vh auto 0;text-align:center}
.login h1{font-size:20px;letter-spacing:.14em;margin:0 0 6px}
.login p{color:var(--dim);font-size:13px;margin:0 0 18px}
input,textarea,select{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 11px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(176,121,58,.35);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:3px;padding:8px 16px;letter-spacing:.06em}
button.primary{background:var(--amber);border-color:var(--amber);color:#fff}
button.ghost{background:transparent}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;margin-top:26px}
.list h2{font-size:13px;letter-spacing:.3em;color:var(--dim);margin:0 0 10px;font-weight:400}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.row:hover{background:rgba(176,121,58,.06)}
.row.on{background:rgba(176,121,58,.12)}
.row .n{color:var(--amber);font-size:12px;width:34px;flex:none}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[draggable]{cursor:grab}
.row.dragging{opacity:.35}
.row.over{box-shadow:inset 0 2px 0 var(--amber)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:rgba(176,121,58,.06);border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12px;color:var(--dim)}
.stats b{display:block;font-size:15px;color:var(--ink);font-weight:600;letter-spacing:0}
@media(max-width:820px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chip{font-size:10px;letter-spacing:.1em;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--dim)}
.chip.pub{color:#3f7a4a;border-color:rgba(63,122,74,.4)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.fields label{display:block;font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:5px}
.fields .wide{grid-column:span 4}
.bodyrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
textarea#body{min-height:520px;resize:vertical;line-height:1.9}
.preview{border:1px solid var(--line);border-radius:3px;background:var(--paper2);padding:18px 20px;max-height:640px;overflow:auto;font-size:15px;line-height:2}
.preview p{margin:0 0 .9em}
.preview h2{font-size:19px;margin:1.4em 0 .6em}
.preview blockquote{margin:1em 0;padding-left:14px;border-left:2px solid rgba(176,121,58,.45);color:var(--soft)}
.bar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bar .sp{flex:1}
.msg{font-size:13px;color:var(--dim);min-height:20px}
.msg.err{color:#a1321f}
@media(max-width:820px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:span 2}.bodyrow{grid-template-columns:1fr}textarea#body{min-height:380px}}
  .artcard { margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px dashed rgba(0,0,0,.12); }
  .artcard h2 { font-size: 1rem; margin: 0 0 .4rem; }
  .artcard .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: .8rem; }
  .artcard .bar select { max-width: 12rem; }
  .artcard .bar input[type=file] { max-width: 22rem; font-size: .82rem; }
  .artprev { margin-top: 1rem; }
  .artprev img { max-width: 240px; max-height: 320px; border-radius: 8px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← 回站</a><b>写稿台</b><span>糖渍旧蜜 · CANDIED RUIN</span><span class="sp"></span><span id="who" class="hide">已登录</span><button id="logout" class="ghost hide" type="button">退出</button></div>

  <div id="loginView" class="card login">
    <h1>写稿台</h1>
    <p>输入口令进入。只有你有这个口令。</p>
    <input id="pass" type="password" placeholder="口令" autocomplete="current-password">
    <div class="bar"><span class="sp"></span><button id="login" class="primary" type="button">进入</button></div>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="appView" class="hide">
    <div class="grid">
      <aside class="list">
        <h2>章节</h2>
        <div id="list"></div>
        <div class="bar"><button id="newCh" type="button">+ 新章</button></div>
      </aside>
      <main>
        <div class="fields">
          <div><label>章号</label><input id="n" type="number" min="1" step="1"></div>
          <div><label>卷</label><input id="vol" type="text" placeholder="第一卷 · 糖罐里的猫"></div>
          <div><label>标题</label><input id="title" type="text" placeholder="一口的价钱"></div>
          <div><label>状态</label><select id="status"><option value="draft">草稿</option><option value="published">已发布</option></select></div>
          <div class="wide"><label>出场（决定图鉴解锁，用、分隔）</label><input id="cast" type="text" placeholder="芙兰、玛尔塔、哈根"></div>
        </div>
        <div class="bodyrow">
          <textarea id="body" placeholder="正文。空行分段；## 小标题；&gt; 引用；**粗体**；--- 分隔线"></textarea>
          <div><div class="preview" id="preview"></div><div class="stats" id="stats"></div></div>
        </div>
        <div class="bar">
          <button id="save" class="primary" type="button">保存</button>
          <button id="del" class="ghost" type="button">删除这一章</button>
          <span class="sp"></span><span id="count" class="msg"></span><span id="msg" class="msg"></span>
        </div>
        <section class="artcard">
          <h2>设定图</h2>
          <p class="msg">选人物 → 选图（自动裁成 3:4、压到 1200×1600）→ 上传。上传后档案页立刻显示，不用重新部署；这里传的图会盖住静态图。</p>
          <div class="bar">
            <select id="artWho"></select>
            <input id="artFile" type="file" accept="image/*">
            <button id="artGo" class="primary" type="button">上传</button>
            <button id="artDel" class="ghost" type="button">删掉这张</button>
            <span id="artMsg" class="msg"></span>
          </div>
          <div class="artprev"><img id="artPrev" alt=""></div>
        </section>
      </main>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let cur = null, rows = [];

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
function render(md){
  const out=[];
  for(const raw of String(md||"").replace(/\r\n/g,"\n").split(/\n{2,}/)){
    const b=raw.trim(); if(!b) continue;
    if(/^-{3,}$/.test(b)){out.push("<hr>");continue;}
    if(b.startsWith("## ")){out.push("<h2>"+inline(b.slice(3).trim())+"</h2>");continue;}
    if(b.startsWith("### ")){out.push("<h2>"+inline(b.slice(4).trim())+"</h2>");continue;}
    if(b.startsWith("> ")){const l=b.split("\n").map(x=>x.replace(/^>\s?/,""));out.push("<blockquote><p>"+inline(l.join(" "))+"</p></blockquote>");continue;}
    out.push("<p>"+b.split("\n").map(x=>inline(x.trim())).filter(Boolean).join("<br>")+"</p>");
  }
  return out.join("");
}
const chars = (t)=>((String(t).match(/[\u4e00-\u9fa5]/g)||[]).length+(String(t).match(/[A-Za-z0-9]+/g)||[]).length);
function statsOf(md){
  const LF = String.fromCharCode(10);
  let text = String(md || "");
  text = text.split(String.fromCharCode(13)).join("");
  const paras = text.split(new RegExp(LF + "{2,}")).map(function(x){return x.trim();})
    .filter(function(x){ return x && !/^-{3,}$/.test(x) && x.indexOf("## ") !== 0 && x.charAt(0) !== ">"; });
  const lens = paras.map(function(p){ return chars(p); });
  const n = lens.length || 1;
  const avg = lens.reduce(function(a,b){return a+b;},0) / n;
  const short = lens.filter(function(l){return l <= 20;}).length / n;
  const long = lens.filter(function(l){return l > 60;}).length;
  let dash = 0, i = -1;
  while ((i = text.indexOf(String.fromCharCode(8212,8212), i + 1)) !== -1) dash++;
  return {chars:chars(text), paras:lens.length, avg:avg, short:short, long:long, dash:dash};
}
function paint(){
  const md = $("body").value;
  $("preview").innerHTML = render(md) || '<p style="color:#8b7d70">这里会显示排版后的样子。</p>';
  $("count").textContent = chars(md) + " 字";
  const st = statsOf(md), box = $("stats");
  if (box) box.innerHTML =
    "<div>字数<b>"+st.chars+"</b></div>"+
    "<div>段数<b>"+st.paras+"</b></div>"+
    "<div>均段<b>"+st.avg.toFixed(1)+"</b></div>"+
    "<div>短段（≤20字）<b>"+Math.round(st.short*100)+"%</b></div>"+
    "<div>长段（>60字）<b>"+st.long+"</b></div>"+
    "<div>破折号<b>"+st.dash+"</b></div>";
}
$("body").addEventListener("input", paint);

async function api(url, opt){ const r = await fetch(url, Object.assign({headers:{"content-type":"application/json"}}, opt||{})); let d={}; try{d=await r.json();}catch(e){} return {status:r.status, ok:r.ok&&d.ok!==false, d}; }

function showLogin(){ $("loginView").classList.remove("hide"); $("appView").classList.add("hide"); $("who").classList.add("hide"); $("logout").classList.add("hide"); }
function showApp(){ $("loginView").classList.add("hide"); $("appView").classList.remove("hide"); $("who").classList.remove("hide"); $("logout").classList.remove("hide"); loadList(); }
async function boot(){ const r = await api("/api/auth"); if (r.d.ok) showApp(); else showLogin(); }

$("login").onclick = async ()=>{
  $("loginMsg").textContent = "";
  const r = await api("/api/auth",{method:"POST",body:JSON.stringify({password:$("pass").value})});
  if (r.ok) showApp(); else $("loginMsg").textContent = r.d.error || "口令不对";
};
$("pass").addEventListener("keydown",(e)=>{if(e.key==="Enter")$("login").click();});
$("logout").onclick = async ()=>{ await api("/api/auth",{method:"DELETE"}); showLogin(); };

async function loadList(){
  const r = await api("/api/chapters");
  rows = r.d.chapters || [];
  $("list").innerHTML = rows.length ? rows.map(c=>
    '<div class="row" draggable="true" data-n="'+c.n+'"><span class="n">'+String(c.n).padStart(2,"0")+'</span><span class="t">'+esc(c.title)+'</span><span class="chip '+(c.status==="published"?"pub":"")+'">'+(c.status==="published"?"已发布":"草稿")+'</span></div>'
  ).join("") : '<p style="color:#8b7d70;font-size:13px">还没有章节。</p>';
  [...document.querySelectorAll(".row")].forEach(el=>el.onclick=()=>openRow(Number(el.dataset.n)));
  if(!cur && rows.length) openRow(rows[0].n);
  wireDrag();
}

let dragFrom = null;
function wireDrag(){
  const els = [...document.querySelectorAll(".row")];
  els.forEach(el=>{
    el.addEventListener("dragstart", ()=>{ dragFrom = Number(el.dataset.n); el.classList.add("dragging"); });
    el.addEventListener("dragend", ()=>{ dragFrom=null; el.classList.remove("dragging"); els.forEach(x=>x.classList.remove("over")); });
    el.addEventListener("dragover", (e)=>{ e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", ()=>el.classList.remove("over"));
    el.addEventListener("drop", async (e)=>{
      e.preventDefault(); el.classList.remove("over");
      const to = Number(el.dataset.n);
      if (!dragFrom || dragFrom === to) return;
      const order = rows.map(r=>r.n);
      const a = order.indexOf(dragFrom), b = order.indexOf(to);
      order.splice(a,1); order.splice(b,0,dragFrom);
      $("msg").textContent = "调整顺序中…";
      const r = await api("/api/reorder",{method:"POST",body:JSON.stringify({order:order})});
      if (r.ok){ $("msg").textContent = "顺序已保存"; cur=null; loadList(); }
      else { $("msg").textContent = r.d.error || "顺序保存失败"; $("msg").className="msg err"; }
    });
  });
}
async function openRow(n){
  const c = rows.find(x=>x.n===n) || {};
  cur = n;
  [...document.querySelectorAll(".row")].forEach(el=>el.classList.toggle("on", Number(el.dataset.n)===n));
  $("n").value = n; $("vol").value = c.vol||""; $("title").value = c.title||""; $("cast").value = c.cast||""; $("status").value = c.status==="published"?"published":"draft";
  $("msg").textContent = "";
  const r = await api("/api/admin/body/"+n);
  $("body").value = (r.d && r.d.body) ? r.d.body : "";
  paint();
}
$("newCh").onclick = ()=>{
  cur = null;
  const next = rows.length ? Math.max.apply(null, rows.map(r=>r.n))+1 : 1;
  $("n").value = next; $("vol").value = rows.length ? (rows[rows.length-1].vol||"") : ""; $("title").value=""; $("cast").value=""; $("status").value="draft"; $("body").value=""; $("msg").textContent="";
  [...document.querySelectorAll(".row")].forEach(el=>el.classList.remove("on"));
  paint();
};
$("save").onclick = async ()=>{
  const payload = {n:Number($("n").value), vol:$("vol").value, title:$("title").value, cast:$("cast").value, body:$("body").value, status:$("status").value};
  $("msg").textContent = "保存中…"; $("msg").className="msg";
  const r = await api("/api/chapters",{method:"POST",body:JSON.stringify(payload)});
  if (r.ok){ $("msg").textContent = (payload.status==="published" ? "已发布，读者刷新就能看到（" : "已存草稿（") + r.d.chars + " 字）"; cur = payload.n; loadList(); }
  else { $("msg").textContent = r.d.error || "保存失败"; $("msg").className="msg err"; }
};
$("del").onclick = async ()=>{
  if(!cur || !confirm("删除第 "+cur+" 章？")) return;
  const r = await api("/api/chapters/"+cur,{method:"DELETE"});
  if(r.ok){ cur=null; $("msg").textContent="已删除"; $("title").value=""; $("body").value=""; paint(); loadList(); }
};
boot();

/* —— 设定图上传 —— */
(function initArt(){
  const NAMES = ["芙兰","琉玥","薇尔","玛尔塔","哈根","皮普","莉娜","塞德里克","奥托·蓝姆","伊莎贝尔","卡尔·冯·德雷","维奥拉·佩奇"];
  const sel = $("artWho"), file = $("artFile"), prev = $("artPrev"), msg = $("artMsg");
  if (!sel) return;
  sel.innerHTML = NAMES.map(function(n,i){ return '<option value="'+(i+1)+'">'+(i+1)+'. '+n+'</option>'; }).join("");
  let data = null, c = 1;
  prev.style.display = "none";
  sel.addEventListener("change", function(){ c = Number(sel.value); data = null; prev.style.display = "none"; msg.textContent = ""; });
  file.addEventListener("change", async function(){
    const f = file.files && file.files[0];
    if (!f) return;
    msg.textContent = "处理中…";
    try {
      const bmp = await createImageBitmap(f);
      const W = 1200, H = 1600;
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const g = cv.getContext("2d");
      g.fillStyle = "#fbf7f0"; g.fillRect(0,0,W,H);
      const s = Math.max(W/bmp.width, H/bmp.height);
      const dw = bmp.width*s, dh = bmp.height*s;
      g.drawImage(bmp, (W-dw)/2, (H-dh)/2, dw, dh);
      data = cv.toDataURL("image/jpeg", 0.86);
      prev.src = data; prev.style.display = "block";
      msg.textContent = "已就绪（约 " + Math.round(data.length*0.75/1024) + " KB）";
    } catch (e) { msg.textContent = "读图失败：" + e.message; }
  });
  $("artGo").addEventListener("click", async function(){
    if (!data) { msg.textContent = "先选一张图"; return; }
    msg.textContent = "上传中…";
    const r = await fetch("/api/upload", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ c: c, data: data }) });
    const j = await r.json().catch(function(){ return {}; });
    msg.textContent = j.ok ? ("上传成功，" + Math.round(j.bytes/1024) + " KB；去档案页刷新看看") : ("失败：" + (j.error || r.status));
  });
  $("artDel").addEventListener("click", async function(){
    if (!confirm("删掉第 " + c + " 位的上传图？（静态图不受影响）")) return;
    const r = await fetch("/api/upload?c=" + c, { method:"DELETE" });
    const j = await r.json().catch(function(){ return {}; });
    msg.textContent = j.ok ? "已删掉" : ("失败：" + (j.error || r.status));
  });
})();
</script>
</body>
</html>
