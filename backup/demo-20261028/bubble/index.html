<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1D · 十字爆炸</title>
<style>
  html, body { height: 100%; margin: 0; background: #08070F; overflow: hidden; }
  canvas { display: block; }
  #gl, #ghost, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 拖影层：同一颗球、延迟 55ms、轻微模糊，压在主体下面 */
  #ghost {
    filter: blur(2px) saturate(1.04);
    opacity: .24;
    pointer-events: none;
  }
  #ghost[hidden] { display: none; }
  #fx { pointer-events: none; }
  #bg { display: none; }
  .tag {
    position: absolute; left: 14px; bottom: 12px; z-index: 3;
    font: 11px/1.6 ui-monospace, Consolas, monospace;
    letter-spacing: .06em; color: rgba(226, 209, 180, .42);
    pointer-events: none; white-space: pre;
  }
  .hint {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    font: 12px/1.6 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .18em; color: rgba(255, 226, 180, .5);
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="ghost"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="tag" id="tag">1D · burst</div>
  <div class="hint" id="hint">点一下球，看爆炸</div>
  <script src="burst.js" defer></script>
  <script src="bubble.js" defer></script>
</body>
</html>
