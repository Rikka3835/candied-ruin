<!doctype html><meta charset="utf-8"><title>probe</title><body style="margin:0;background:#000">
<script>
const V = document.createElement("video");
V.src = "_probe.mp4"; V.muted = true; V.playsInline = true; V.preload = "auto";
const C = document.createElement("canvas");
const W = 320;
document.body.appendChild(V);
window.__probe = null;

function ready() {
  return new Promise((res) => {
    if (V.readyState >= 2) return res();
    V.addEventListener("loadeddata", () => res(), { once: true });
  });
}
function seek(t) {
  return new Promise((res) => {
    const on = () => { V.removeEventListener("seeked", on); res(); };
    V.addEventListener("seeked", on);
    V.currentTime = Math.min(t, V.duration - 0.001);
  });
}

async function run() {
  await ready();
  const dur = V.duration, vw = V.videoWidth, vh = V.videoHeight;
  const h = Math.round((W * vh) / vw);
  C.width = W; C.height = h;
  const g = C.getContext("2d", { willReadFrequently: true });
  const step = 1 / 30;
  const frames = [];
  for (let t = 0; t < dur; t += step) {
    await seek(t);
    g.drawImage(V, 0, 0, W, h);
    const d = g.getImageData(0, 0, W, h).data;
    let count = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    for (let y = 0; y < h; y += 1) {
      for (let x = 0; x < W; x += 1) {
        const i = (y * W + x) * 4;
        const r = d[i], gg = d[i + 1], b = d[i + 2];
        // 琥珀/亮黄：红高、蓝低
        if (r > 205 && gg > 140 && b < 135 && r - b > 95) {
          count += 1;
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    frames.push({ t: +t.toFixed(3), count, w: x1 >= 0 ? x1 - x0 + 1 : 0, h: y1 >= 0 ? y1 - y0 + 1 : 0 });
  }
  const counts = frames.map((f) => f.count).sort((a, b) => a - b);
  const median = counts[Math.floor(counts.length / 2)];
  const peak = Math.max(...frames.map((f) => f.count));
  const thr = Math.max(median * 2.2, peak * 0.35);
  const hot = frames.filter((f) => f.count > thr);
  // 找最长连续段
  let best = null, cur = null;
  for (const f of frames) {
    const hit = f.count > thr;
    if (hit) { if (!cur) cur = { a: f.t, b: f.t, peak: f.count, w: f.w, h: f.h }; else { cur.b = f.t; if (f.count > cur.peak) { cur.peak = f.count; cur.w = f.w; cur.h = f.h; } } }
    else if (cur) { if (!best || (cur.b - cur.a) > (best.b - best.a)) best = cur; cur = null; }
  }
  if (cur && (!best || (cur.b - cur.a) > (best.b - best.a))) best = cur;
  window.__probe = { dur: +dur.toFixed(2), vw, vh, median, peak, thr, hotFrames: hot.length, best, sample: frames.slice(0, 3) };
}
run().catch((e) => { window.__probe = { error: String(e) }; });
</script>
